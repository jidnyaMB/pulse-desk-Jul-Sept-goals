services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk
      POSTGRES_DB: pulsedesk
    ports:
      - "5434:5432"
    volumes:
      - pulsedesk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsedesk-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga:
    image: openfga/openfga:latest
    container_name: pulsedesk-openfga
    restart: unless-stopped
    # In-memory datastore — dev/demo only. Data (store/model/tuples) is lost
    # on restart. Production must point this at a persistent Postgres datastore.
    command: run --datastore-engine memory
    ports:
      - "8080:8080" # HTTP API
      - "8081:8081" # gRPC API
      - "3002:3000" # Playground UI (host 3002 — 3000 is taken by the Nest API)

volumes:
  pulsedesk_pg_data:
